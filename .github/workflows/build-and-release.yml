name: Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Create Dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"1234567890","project_id":"dummy-id","storage_bucket":"dummy-id.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abc123def456","android_client_info":{"package_name":"com.weartools.weekdayutccomp"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}' > wear/google-services.json

      - name: Decode Keystore
        if: ${{ secrets.SIGNING_KEY_BASE64 != '' }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > wear/release.jks

      - name: Build Release APK and AAB
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          KEYSTORE_FILE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :wear:assembleRelease :wear:bundleRelease

      - name: Locate Artifacts
        run: |
          echo "Finding APKs..."
          find wear/build/outputs/apk/release -name "*.apk" || echo "No APKs found"
          echo "Finding AABs..."
          find wear/build/outputs/bundle/release -name "*.aab" || echo "No AABs found"

      - name: Upload Build Artifacts (CI)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: complications-suite-wear-release
          path: |
            wear/build/outputs/apk/release/*.apk
            wear/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wear/build/outputs/apk/release/*.apk
            wear/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
